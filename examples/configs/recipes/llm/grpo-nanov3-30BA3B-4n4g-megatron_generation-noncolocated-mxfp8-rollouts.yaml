defaults: ../../grpo_math_1B.yaml
grpo:
  num_prompts_per_step: 2
  num_generations_per_prompt: 8
checkpointing:
  enabled: false
  checkpoint_dir: results/grpo-nanov3-30BA3B-4n4g-megatron_generation-noncolocated-mxfp8-rollouts
policy:
  model_name: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-Base-BF16
  tokenizer:
    name: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-BF16
  train_global_batch_size: 16
  train_micro_batch_size: 1
  max_total_sequence_length: 2048
  automodel_cfg:
    enabled: false
  megatron_cfg:
    enabled: true
    bias_activation_fusion: false
    tensor_model_parallel_size: 2
    expert_model_parallel_size: 8
    sequence_parallel: true
    moe_router_dtype: fp32
  sequence_packing:
    enabled: false
  generation:
    backend: megatron
    refit_transport: mcore
    mcore_generation_config:
      refit_backend: nccl
      transformer_impl: inference_optimized
      # Only flashinfer runs MXFP8 experts on the TRT-LLM routed MoE kernels;
      # torch and vllm both fall back to MCore's fused-MoE path for MXFP8.
      inference_grouped_gemm_backend: flashinfer
      # Without this bound FlashInfer's routed MXFP8 MoE runs every decode step over the full
      # 65,536-row NVLS buffer (44 s/step instead of 9 s). MCore engages it only when
      # max_requests * (num_speculative_tokens + 1) * EP <= capacity, with max_requests derived from
      # the KV pool and the Mamba-state budget (about 40 here); 1024 leaves headroom, and the worker
      # raises at startup if the bound cannot engage. Needs >= 256 rows at EP8 for CUDA-graph capture.
      inference_flashinfer_mxfp8_token_capacity: 1024
      inference_moe_token_dispatcher_type: nvls
      tensor_model_parallel_size: 2
      expert_model_parallel_size: 8
      sequence_parallel: true
      logprobs_mode: raw_logprobs
      # The checkpoint declares mamba_ssm_cache_dtype=float32; bf16 SSM state can overflow.
      mamba_inference_ssm_states_dtype: float32
      fp8_cfg:
        enabled: true
        fp8: e4m3
        fp8_recipe: mxfp8
        fp8_param: true
    colocated:
      enabled: false
      resources:
        gpus_per_node: 4
        num_nodes: 2
logger:
  wandb_enabled: true
  tensorboard_enabled: true
  wandb:
    project: nemo-rl
    name: grpo-nanov3-30BA3B-4n4g-megatron_generation-noncolocated-mxfp8-rollouts
cluster:
  gpus_per_node: 4
  num_nodes: 4
  segment_size: 2
